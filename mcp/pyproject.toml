[project]
name = "resume-tailor-mcp"
version = "0.1.0"
description = "FastMCP server exposing resume analysis and ATS tools"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6,<5",
    "pydantic>=2.7",
    "markitdown[pdf,docx]>=0.1",
    "python-docx>=1.1"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pyright>=1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
