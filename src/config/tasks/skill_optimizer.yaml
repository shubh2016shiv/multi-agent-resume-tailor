optimize_skills_section_task:
  description: >
    Rank every existing resume skill against the parsed job requirements. Use semantic
    judgment for genuine equivalents and transferable matches, but make decisions only
    about the IDs in CONTEXT.

    Return one JSON object with ranked_skills. Each item must contain resume_skill_id,
    rank, category, and matched_job_requirement_ids. Include every resume skill exactly
    once. Use only supplied S-IDs and J-IDs. Do not add, remove, rename, or rewrite a skill.
    Lower ranks appear first. Give unrelated skills later ranks and an empty match list.

    Example JSON shape:
      {"ranked_skills":[{"resume_skill_id":"S001","rank":1,"category":"Programming Languages","matched_job_requirement_ids":["J002"]}]}

  expected_output: >
    One valid SkillsRankingResponse JSON object containing only ID-based ranking,
    categorization, and semantic requirement matches.

  agent: skills_section_strategist
